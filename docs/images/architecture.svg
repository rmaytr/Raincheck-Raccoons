<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Raincheck Raccoons: Vercel and Cloudflare architecture</title><desc id="desc">React clients use the Next.js website and same-origin API on Vercel. The gateway sends signed requests to the authoritative Cloudflare game API, which stores room snapshots and quotas in D1.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffb66d"/></marker></defs>
<rect width="1120" height="430" rx="20" fill="#24203b"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#fff6dc">
<text x="35" y="46" font-size="23" font-weight="700">One game. A clean Vercel URL. Authoritative multiplayer state.</text>
<g stroke="#887ca6" stroke-width="1.5" fill="#35304c"><rect x="35" y="135" width="190" height="155" rx="14"/><rect x="285" y="95" width="250" height="235" rx="14"/><rect x="595" y="95" width="260" height="235" rx="14"/><rect x="915" y="135" width="170" height="155" rx="14"/></g>
<text x="52" y="174" font-size="20" font-weight="700">Phone or laptop</text><text x="52" y="211" font-size="16">React + TypeScript</text><text x="52" y="244" font-size="15" fill="#c9c1dd">No account required</text>
<text x="305" y="132" font-size="20" font-weight="700">Next.js on Vercel</text><text x="305" y="175" font-size="16">Game page + static assets</text><text x="305" y="213" font-size="16">Four same-origin API routes</text><text x="305" y="251" font-size="16">Cookie + Origin checks</text><text x="305" y="289" font-size="16">Signed server requests</text>
<text x="615" y="132" font-size="20" font-weight="700">Cloudflare game API</text><text x="615" y="175" font-size="16">Rules, scores, bots, deadlines</text><text x="615" y="213" font-size="16">Privacy + host authorization</text><text x="615" y="251" font-size="16">HMAC + per-client quotas</text><text x="615" y="289" font-size="16">Revision-checked D1 writes</text>
<text x="934" y="174" font-size="20" font-weight="700">Cloudflare D1</text><text x="934" y="211" font-size="16">Room snapshots</text><text x="934" y="244" font-size="16">Quotas + expiry</text>
<g fill="none" stroke="#ffb66d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M225 211H285"/><path d="M535 211H595"/><path d="M855 211H915"/></g>
<text x="35" y="376" font-size="16" fill="#c9c1dd">The browser never receives the proxy key or opponents’ unrevealed choices.</text>
<text x="35" y="405" font-size="15" fill="#c9c1dd">Direct Cloudflare and Sites hosting remain supported. Game rules, artwork, audio and scoring are unchanged.</text>
</g></svg>